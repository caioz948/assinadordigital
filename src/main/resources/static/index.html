<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinador Digital</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

<div class="container" id="container">
    <h2>Assinador Digital</h2>
    <p class="subtitulo">Envie um documento PDF para validação e assinatura</p>

    <form id="uploadForm">
        <div class="form-group">
            <label for="arquivo">Selecione o arquivo PDF:</label>
            <input type="file" id="arquivo" name="arquivo" accept=".pdf" required>
        </div>
        <button type="submit" id="btnEnviar">Enviar PDF</button>
    </form>

    <div id="resultado"></div>

    <div id="areaAssinatura" hidden>
        <div id="areaPreview" class="area-preview" hidden>
            <p class="preview-dica">Arraste e redimensione a etiqueta para posicionar a assinatura.</p>

            <div class="preview-navegacao">
                <button type="button" id="botaoPaginaAnterior" class="botao-navegacao">&lt;</button>
                <span id="indicadorPagina" class="indicador-pagina">Página 1 de 1</span>
                <button type="button" id="botaoProximaPagina" class="botao-navegacao">&gt;</button>
            </div>

            <div id="previewContainer" class="preview-container">
                <canvas id="previewCanvas"></canvas>
                <div id="etiquetaArrastavel" class="etiqueta-arrastavel">
                    <span class="etiqueta-texto">Assinatura</span>
                    <div id="alcaRedimensionar" class="alca-redimensionar"></div>
                </div>
            </div>
        </div>

        <button type="button" id="btnAssinar" class="botao-assinar">Assinar PDF</button>
    </div>
</div>

<script type="module" src="/js/assinar.js"></script>

</body>
</html>
