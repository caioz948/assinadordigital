<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinador Digital - Upload de PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0052a3;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .sucesso {
            background-color: #e6f4ea;
            border: 1px solid #b7e1cd;
            color: #137333;
        }

        .erro {
            background-color: #fce8e6;
            border: 1px solid #f5c6cb;
            color: #c5221f;
        }

        .info-item {
            margin: 6px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Assinador Digital</h2>
    <p style="text-align: center; color: #666; font-size: 14px;">Envie um documento PDF para validação</p>

    <form id="uploadForm">
        <div class="form-group">
            <label for="arquivo">Selecione o arquivo PDF:</label>
            <input type="file" id="arquivo" name="arquivo" accept=".pdf" required>
        </div>
        <button type="submit" id="btnEnviar">Enviar PDF</button>
    </form>

    <div id="resultado"></div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const inputArquivo = document.getElementById('arquivo');
        const divResultado = document.getElementById('resultado');
        const btnEnviar = document.getElementById('btnEnviar');

        if (!inputArquivo.files.length) {
            alert('Por favor, selecione um arquivo PDF.');
            return;
        }

        const formData = new FormData();
        formData.append('arquivo', inputArquivo.files[0]);

        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Enviando e processando...';
        divResultado.style.display = 'none';

        try {
            const response = await fetch('/api/v1/documentos/upload', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const dados = await response.json();
                divResultado.className = 'sucesso';
                divResultado.innerHTML = `
                    <strong>✅ ${dados.mensagem}</strong><br><br>
                    <div class="info-item"><strong>Nome:</strong> ${dados.nomeArquivo}</div>
                    <div class="info-item"><strong>Tipo:</strong> ${dados.tipoConteudo}</div>
                    <div class="info-item"><strong>Tamanho:</strong> ${(dados.tamanhoBytes / 1024).toFixed(2)} KB</div>
                    <div class="info-item"><strong>Páginas:</strong> ${dados.quantidadePaginas}</div>
                `;
            } else {
                const erroTexto = await response.text();
                divResultado.className = 'erro';
                divResultado.innerHTML = `<strong>❌ Erro:</strong> ${erroTexto}`;
            }
        } catch (error) {
            divResultado.className = 'erro';
            divResultado.innerHTML = `<strong>❌ Erro de Conexão:</strong> Não foi possível conectar ao servidor.`;
        } finally {
            divResultado.style.display = 'block';
            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Enviar PDF';
        }
    });
</script>

</body>
</html>
