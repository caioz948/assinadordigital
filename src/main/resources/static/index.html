<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinador Digital - Upload de PDF</title>
    <link rel="stylesheet" href="/css/assinar.css">
</head>
<body>

<div class="container">
    <h2>Assinador Digital</h2>
    <p style="text-align: center; color: #666; font-size: 14px;">Envie um documento PDF para validação</p>

    <form id="uploadForm">
        <div class="form-group">
            <label for="arquivo">Selecione o arquivo PDF:</label>
            <input type="file" id="arquivo" name="arquivo" accept=".pdf" required>
        </div>
        <button type="submit" id="btnEnviar">Enviar PDF</button>
    </form>

    <div id="resultado"></div>
</div>

<script>
    // Monta as linhas do resultado com textContent para não interpretar como
    // HTML o nome do arquivo ou mensagens vindas do servidor.
    function criarLinha(rotulo, valor) {
        const linha = document.createElement('div');
        linha.className = 'info-item';
        const forte = document.createElement('strong');
        forte.textContent = rotulo;
        linha.appendChild(forte);
        if (valor !== null && valor !== undefined) {
            linha.append(' ' + valor);
        }
        return linha;
    }

    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const inputArquivo = document.getElementById('arquivo');
        const divResultado = document.getElementById('resultado');
        const btnEnviar = document.getElementById('btnEnviar');

        if (!inputArquivo.files.length) {
            alert('Por favor, selecione um arquivo PDF.');
            return;
        }

        const formData = new FormData();
        formData.append('arquivo', inputArquivo.files[0]);

        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Enviando e processando...';
        divResultado.style.display = 'none';

        try {
            const response = await fetch('/api/v1/documentos/upload', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const dados = await response.json();
                divResultado.className = 'sucesso';
                divResultado.replaceChildren(
                    criarLinha('✅ ' + dados.mensagem),
                    document.createElement('br'),
                    criarLinha('Nome:', dados.nomeArquivo),
                    criarLinha('Tipo:', dados.tipoConteudo),
                    criarLinha('Tamanho:', (dados.tamanhoBytes / 1024).toFixed(2) + ' KB'),
                    criarLinha('Páginas:', dados.quantidadePaginas)
                );
            } else {
                const contentType = response.headers.get('Content-Type') || '';
                const mensagem = contentType.includes('application/json')
                    ? (await response.json()).mensagem
                    : await response.text();
                divResultado.className = 'erro';
                divResultado.replaceChildren(criarLinha('❌ Erro:', mensagem || 'Não foi possível processar o arquivo.'));
            }
        } catch (error) {
            divResultado.className = 'erro';
            divResultado.replaceChildren(criarLinha('❌ Erro de Conexão:', 'Não foi possível conectar ao servidor.'));
        } finally {
            divResultado.style.display = 'block';
            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Enviar PDF';
        }
    });
</script>

</body>
</html>
