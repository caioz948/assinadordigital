spring.application.name=assinadordigital

server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=${ASSINATURA_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ASSINATURA_UPLOAD_MAX_SIZE:10MB}

assinatura.upload.max-size-bytes=${ASSINATURA_UPLOAD_MAX_SIZE_BYTES:10485760}

assinatura.posicao.pagina=${ASSINATURA_POSICAO_PAGINA:-1}
assinatura.posicao.x=${ASSINATURA_POSICAO_X:350}
assinatura.posicao.y=${ASSINATURA_POSICAO_Y:100}
assinatura.posicao.width=${ASSINATURA_POSICAO_WIDTH:200}
assinatura.posicao.height=${ASSINATURA_POSICAO_HEIGHT:80}

signature.keystore.path=${SIGNATURE_KEYSTORE_PATH:classpath:certs/dev-keystore.p12}
signature.keystore.password=${SIGNATURE_KEYSTORE_PASSWORD:changeit}
signature.keystore.alias=${SIGNATURE_KEYSTORE_ALIAS:assinador-dev}
signature.keystore.type=${SIGNATURE_KEYSTORE_TYPE:PKCS12}

logging.level.br.edu.utfpr.td.tsi.assinadordigital=INFO
